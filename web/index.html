<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KCD Pak Browser</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
  </head>
  <body>
    <header>
      <h1>KCD Pak Browser</h1>
      <button id="open" type="button">Open KCD folder</button>
      <input id="open-input" type="file" webkitdirectory hidden />
      <button id="install" type="button" class="secondary">Install from GOG installer</button>
      <input id="install-input" type="file" webkitdirectory hidden />
      <button id="installed" type="button" class="secondary" hidden>Open installed copy</button>
      <button id="package" type="button" class="secondary" hidden>Open compact package</button>
      <span id="status">Pick your game root (the folder with <code>Data</code> and <code>bin</code>), or install from the GOG installer folder (pick it or drop it here). Files are read locally; nothing is uploaded.</span>
    </header>
    <main>
      <section id="paks" aria-label="Archives">
        <button id="characters" type="button" class="side-action" disabled>Characters (game database)</button>
        <button id="world" type="button" class="side-action" disabled>World: Rataje (terrain)</button>
        <button id="slim" type="button" class="side-action" disabled>Compact package (faster loading)</button>
        <div id="pak-groups"></div>
      </section>
      <section id="browser" aria-label="Archive contents">
        <div id="browser-head">
          <span id="pak-title">No archive selected</span>
          <input id="filter" type="search" placeholder="Filter paths in this pak…" disabled />
        </div>
        <div id="tree"></div>
      </section>
      <section id="preview" aria-label="Preview"></section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
